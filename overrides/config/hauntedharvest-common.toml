[pumpkin_carving]
	#Allows custom carved pumpkins to be placed by villagers and appear in abandoned farm structure
	custom_carvings = true
	#Pumpkin carving mode
	#Allowed Values: NONE, BOTH, GUI, MANUAL
	pumpkin_carve_mode = "BOTH"
	#Jack o Lantern carving mode
	#Allowed Values: NONE, BOTH, GUI, MANUAL
	jack_o_lantern_carve_mode = "NONE"

	[halloween_season.start]
		# Default: 10
		# Range: 1 ~ 12
		month = 10
		# Default: 20
		# Range: 1 ~ 31
		day = 20

	[halloween_season.end]
		# Default: 11
		# Range: 1 ~ 12
		month = 11
		# Default: 10
		# Range: 1 ~ 31
		day = 10

[mob_pumpkins_season]
	#Chance for a mob to wear a pumpkin. All this does not affect vanilla halloween behavior
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	wear_chance = 0.25

	[mob_pumpkins_season.start]
		# Default: 10
		# Range: 1 ~ 12
		month = 10
		# Default: 30
		# Range: 1 ~ 31
		day = 30

	[mob_pumpkins_season.end]
		# Default: 10
		# Range: 1 ~ 12
		month = 10
		# Default: 31
		# Range: 1 ~ 31
		day = 31

	[trick_or_treating_time.start]
		# Default: 18
		# Range: 0 ~ 23
		hour = 18
		# Default: 0
		# Range: 0 ~ 59
		minute = 0

	[trick_or_treating_time.end]
		# Default: 6
		# Range: 0 ~ 23
		hour = 6
		# Default: 0
		# Range: 0 ~ 59
		minute = 0

[season_mod_compat]
	#Enables compatibility with Serene Seasons (Forge) or Fabric Seasons (Fabric). Only takes effect if the mod is installed. Will make halloween season only active during certain seasons. Note that this will override previous time window settings
	enabled = false

[general]
	#Enable Creative Tab
	creative_tab = false

[features]
	corn = true
	grim_apple = true
	popcorn = true
	carved_pumpkin = true
	splattered_egg = true
	candy_corn = true

	[features.paper_bag]
		enabled = true
		#Wearing a paper bag will hide the player's name tag
		hide_name_tag = true
		#Endermen will not attack players wearing a paper bag
		hide_from_enderman = true
